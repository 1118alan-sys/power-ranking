<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戰力排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg-1: #201811;
    --bg-2: #070503;
    --text-main: #f2e9d6;
    --text-sub: #a99878;
    --text-faint: #6e5f47;
    --surface: #1c150e;
    --surface-hover: #2b2016;
    --border: #4a3820;
    --border-soft: #2e2418;
    --accent: #c9a24a;
    --accent-2: #8c2020;
    --gold: #f2c14e;
    --pink: #e2574c;
    --rank-bg: #2b2016;
    --rank-text: #c9a24a;
    --danger: #e2574c;
    --tab-text: #a99878;
    --pill-bg: #2b2016;
    --pill-text: #8a7554;
  }
  [data-theme="light"] {
    --bg-1: #f1e6cd;
    --bg-2: #fbf6ea;
    --text-main: #2c2011;
    --text-sub: #6d5b3d;
    --text-faint: #a4906a;
    --surface: #fffaf0;
    --surface-hover: #f1e4c4;
    --border: #d9c393;
    --border-soft: #e8dab4;
    --accent: #9c7a1f;
    --accent-2: #8c2020;
    --gold: #a6791b;
    --pink: #b23a30;
    --rank-bg: #f1e4c4;
    --rank-text: #7a5c1e;
    --danger: #b23a30;
    --tab-text: #6d5b3d;
    --pill-bg: #f1e4c4;
    --pill-text: #8a744d;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,164,74,0.16) 0%, transparent 60%),
      radial-gradient(circle at 50% 0%, var(--bg-1) 0%, var(--bg-2) 65%);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text-main);
    padding: 40px 20px 80px;
    transition: background 0.2s, color 0.2s;
  }
  .wrap { max-width: 640px; margin: 0 auto; text-align: center; }
  .title-wrap {
    margin-bottom: 40px;
  }
  h1 {
    text-align: center;
    font-family: "Noto Serif TC", "Noto Sans TC", serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 10px;
    margin: 0;
    background: linear-gradient(100deg, var(--accent) 0%, var(--gold) 35%, var(--accent-2) 60%, var(--accent) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: pointer;
    padding: 4px 12px;
    display: inline-block;
    animation: shine 6s linear infinite;
    filter: drop-shadow(0 0 20px rgba(201, 164, 74, 0.35));
    position: relative;
  }
  @keyframes shine {
    to { background-position: 300% center; }
  }
  h1::before, h1::after {
    content: '';
    display: inline-block;
    width: 34px;
    height: 1px;
    vertical-align: middle;
    background: linear-gradient(90deg, transparent, var(--accent));
    margin: 0 14px 6px 0;
  }
  h1::after {
    background: linear-gradient(90deg, var(--accent), transparent);
    margin: 0 0 6px 14px;
  }
  h1:hover { filter: drop-shadow(0 0 30px rgba(201, 164, 74, 0.55)); }
  h1 input {
    font-family: "Noto Serif TC", serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 8px;
    text-align: center;
    color: var(--gold);
    border-color: var(--accent);
    max-width: 360px;
    width: 100%;
  }
  .subtitle {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 32px;
  }
  input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text-main);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus { border-color: var(--accent); }
  .form-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  button#viewToggle, button#themeToggle {
    background: var(--surface);
    border: 1px solid var(--border);
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    padding: 12px 16px;
    color: var(--tab-text);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  button#viewToggle:hover, button#themeToggle:hover { border-color: var(--accent); color: var(--text-main); }
  button#addBtn, #bulkBtn {
    position: relative;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: 1px solid rgba(255,255,255,0.15);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    padding: 12px 28px;
    color: #fff8e8;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s;
  }
  button#addBtn:hover, #bulkBtn:hover { filter: brightness(1.12); }
  button#addBtn:active, #bulkBtn:active { transform: scale(0.97); }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin: -18px 0 20px 4px;
    display: none;
  }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1px solid var(--border-soft);
    border-left: 3px solid var(--border);
    border-radius: 4px;
    padding: 12px 16px;
    animation: fadeIn 0.25s ease;
  }
  .img-btn {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--pill-text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s;
    overflow: hidden;
    padding: 0;
  }
  .img-btn:hover { border-color: var(--accent); color: var(--text-main); }
  .img-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .row-main {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .grid .row {
    align-items: center;
    text-align: center;
    padding: 20px 12px 16px;
    position: relative;
  }
  .grid .row-main {
    flex-direction: column;
    gap: 10px;
  }
  .grid .row .name { width: 100%; text-align: center; }
  .grid .row .power { min-width: unset; }
  .grid .row .del {
    position: absolute;
    top: 6px;
    right: 6px;
  }
  .grid .rank {
    width: 44px;
    height: 44px;
    font-size: 16px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .rank {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
    background: var(--rank-bg);
    color: var(--rank-text);
    position: relative;
    overflow: hidden;
  }
  .rank.gold, .rank.silver, .rank.bronze {
    background-size: 220% 220%;
  }
  .rank.gold { background-image: linear-gradient(135deg, #fff3c4, #f2c14e, #b8860b, #f2c14e, #fff3c4); color: #2a1c00; animation: shimmer 3s linear infinite; }
  .rank.silver { background-image: linear-gradient(135deg, #f4f4f8, #d8d8e0, #9a9aab, #d8d8e0, #f4f4f8); color: #24242e; animation: shimmer 3.4s linear infinite; }
  .rank.bronze { background-image: linear-gradient(135deg, #ecb98a, #cd8b5c, #8a5a34, #cd8b5c, #ecb98a); color: #2a1a0c; animation: shimmer 3.8s linear infinite; }
  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .rank.gold::after, .rank.silver::after, .rank.bronze::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.75) 48%, transparent 66%);
    background-size: 250% 250%;
    animation: sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { background-position: 200% 200%; }
    60%, 100% { background-position: -50% -50%; }
  }
  .name { flex: 1; font-size: 16px; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 2px 6px; transition: background 0.15s; text-align: left; }
  .name:hover { background: var(--surface-hover); }
  .name input {
    width: 100%;
    padding: 4px 6px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
    border-color: var(--accent);
  }
  .power { font-size: 15px; font-weight: 600; color: var(--gold); min-width: 70px; text-align: right; cursor: pointer; border-radius: 6px; padding: 2px 6px; transition: background 0.15s; }
  .power:hover { background: var(--surface-hover); }
  .power input {
    width: 90px;
    text-align: right;
    padding: 4px 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    border-color: var(--accent);
  }
  .del {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    transition: color 0.15s;
  }
  .del:hover { color: var(--danger); }

  .row.top10 {
    border-color: rgba(201,164,74,0.5);
    box-shadow: 0 2px 12px rgba(201,164,74,0.12);
  }
  .row.top10 .rank {
    font-size: 15px;
    box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 3px var(--border);
  }
  .row.rank1 {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold), 0 4px 20px rgba(242,193,78,0.25);
    animation: pulseGold 2.4s ease-in-out infinite;
  }
  .row.rank1 .rank {
    width: 40px;
    height: 40px;
    font-size: 17px;
  }
  .row.rank2 {
    border-color: #c8c8d4;
    box-shadow: 0 0 0 1px #c8c8d4, 0 4px 16px rgba(0,0,0,0.15);
  }
  .row.rank3 {
    border-color: #cd8b5c;
    box-shadow: 0 0 0 1px #cd8b5c, 0 4px 16px rgba(0,0,0,0.15);
  }
  @keyframes pulseGold {
    0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 4px 20px rgba(242,193,78,0.25); }
    50% { box-shadow: 0 0 0 1px var(--gold), 0 4px 28px rgba(242,193,78,0.45); }
  }
  .row[data-tier] {
    border-color: var(--tier-color);
    box-shadow: 0 0 0 1px var(--tier-color), 0 0 14px var(--tier-glow);
  }
  .grid .row[data-tier] {
    border-color: var(--tier-color);
    box-shadow: 0 0 0 1px var(--tier-color), 0 0 14px var(--tier-glow);
  }
  .tier-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    color: #1a1626;
    background: var(--tier-color);
    box-shadow: 0 0 8px var(--tier-glow);
    flex-shrink: 0;
  }
  .tier-picker {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .tier-chip {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.15s;
  }
  .tier-chip:hover { transform: scale(1.15); }
  .tier-chip.active { border-color: var(--text-main); box-shadow: 0 0 8px currentColor; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--border);
    padding: 7px 16px;
    color: var(--tab-text);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--text-main); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: var(--accent);
    border-bottom: 2px solid var(--gold);
    color: #fff8e8;
    font-weight: 700;
  }
  .lanes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .grid .lanes { justify-content: center; }
  .lane-pill {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--pill-text);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .lane-pill:hover { border-color: var(--accent); }
  .lane-pill.active {
    background: rgba(201,164,74,0.18);
    border-color: var(--accent);
    color: var(--text-main);
  }
  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    padding: 40px 0;
  }
  .auth-row {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 50;
    margin-bottom: 0;
  }
  .auth-link {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 4px;
  }
  .auth-link:hover { color: var(--accent); }
  .auth-status {
    font-size: 12px;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .auth-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    max-width: 260px;
    margin: 0 auto 18px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 14px;
  }
  .auth-form.open { display: flex; }
  #authForm {
    position: fixed;
    right: 16px;
    bottom: 60px;
    z-index: 50;
    margin: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .auth-form input, .auth-form textarea {
    padding: 8px 10px;
    font-size: 13px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
  }
  #bulkForm { max-width: 320px; }
  .auth-form button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 8px;
    padding: 8px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .auth-error {
    color: var(--danger);
    font-size: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-wrap">
    <h1 id="title">戰力排行榜</h1>
  </div>

  <div class="auth-row" id="authRow">
    <button class="auth-link" id="authLink">摸摸小被被</button>
  </div>
  <div class="auth-form" id="authForm">
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="密碼">
    <div class="auth-error" id="authError">登入失敗，請確認帳號密碼</div>
    <button id="authSubmit">登入</button>
  </div>

  <div class="form-row" id="formRow">
    <button id="addBtn" style="display:none;">+ 新增角色</button>
    <button id="bulkBtn" style="display:none;">批次匯入</button>
    <button id="viewToggle" aria-label="切換顯示格式">⊞</button>
    <button id="themeToggle" aria-label="切換亮暗主題">☾</button>
  </div>

  <div class="auth-form" id="bulkForm">
    <textarea id="bulkNames" rows="8" placeholder="每行一個角色名稱，貼上後按下方按鈕" style="resize:vertical; font-family:inherit;"></textarea>
    <button id="bulkSubmit">匯入全部</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="list" id="list"></div>
  <input type="file" id="imgInput" accept="image/*" style="display:none;">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBj_4lxTHCh37UJ9KaiZmIwbkygDUQxeNs",
    authDomain: "xyratex001.firebaseapp.com",
    projectId: "xyratex001",
    storageBucket: "xyratex001.firebasestorage.app",
    messagingSenderId: "771758627219",
    appId: "1:771758627219:web:b12f25f0becfd1fdeaf066"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const rankingRef = doc(db, "rankings", "main");

  let isAdmin = false;
  let suppressNextWrite = false;

  let characters = [];
  const STORAGE_KEY = 'characters';
  const TITLE_KEY = 'title';
  const VIEW_KEY = 'viewMode';
  const LANES = ['凱薩路', '打野', '中路', '魔龍路', '輔助'];
  const TIERS = [
    { key: '紅', color: '#ff4757', glow: 'rgba(255,71,87,0.55)' },
    { key: '橙', color: '#ff9f43', glow: 'rgba(255,159,67,0.55)' },
    { key: '紫', color: '#b46fe0', glow: 'rgba(180,111,224,0.55)' },
    { key: '藍', color: '#4aa3ff', glow: 'rgba(74,163,255,0.55)' },
    { key: '綠', color: '#2ed573', glow: 'rgba(46,213,115,0.55)' },
    { key: '白', color: '#e8e4f5', glow: 'rgba(232,228,245,0.45)' }
  ];
  let title = '戰力排行榜';
  let viewMode = 'list';
  let currentTab = '全部';

  const THEME_KEY = 'theme';
  let theme = 'dark';

  const addBtn = document.getElementById('addBtn');
  const bulkBtn = document.getElementById('bulkBtn');
  const bulkForm = document.getElementById('bulkForm');
  const bulkNames = document.getElementById('bulkNames');
  const bulkSubmit = document.getElementById('bulkSubmit');
  const viewToggle = document.getElementById('viewToggle');
  const themeToggle = document.getElementById('themeToggle');
  const listEl = document.getElementById('list');
  const titleEl = document.getElementById('title');
  const tabsEl = document.getElementById('tabs');
  const imgInput = document.getElementById('imgInput');
  let pendingImageId = null;
  const authRow = document.getElementById('authRow');
  const authLink = document.getElementById('authLink');
  const authForm = document.getElementById('authForm');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const authSubmit = document.getElementById('authSubmit');

  function renderTabs() {
    const tabs = ['全部', ...LANES];
    tabsEl.innerHTML = tabs.map(t =>
      `<div class="tab ${t === currentTab ? 'active' : ''}" data-tab="${t}">${t}</div>`
    ).join('');
  }

  tabsEl.addEventListener('click', e => {
    const tab = e.target.dataset.tab;
    if (!tab) return;
    currentTab = tab;
    renderTabs();
    render();
  });

  async function loadData() {
    try {
      const savedView = localStorage.getItem(VIEW_KEY);
      if (savedView === 'grid' || savedView === 'list') viewMode = savedView;
    } catch (err) {
      // 保留預設視圖
    }
    try {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
    } catch (err) {
      // 保留預設主題
    }
    applyViewMode();
    applyTheme();
    renderTabs();

    onSnapshot(rankingRef, snap => {
      const data = snap.data();
      characters = (data && data.characters) || [];
      title = (data && data.title) || '戰力排行榜';
      titleEl.textContent = title;
      render();
    }, err => {
      console.error('讀取失敗', err);
      listEl.innerHTML = '<div class="empty">讀取資料失敗，請確認網路連線</div>';
    });
  }

  async function saveData() {
    try {
      await setDoc(rankingRef, { title, characters }, { merge: true });
    } catch (err) {
      console.error('儲存失敗', err);
    }
  }

  async function saveTitle() {
    try {
      await setDoc(rankingRef, { title, characters }, { merge: true });
    } catch (err) {
      console.error('儲存失敗', err);
    }
  }

  function updateAuthUI() {
    addBtn.style.display = isAdmin ? '' : 'none';
    bulkBtn.style.display = isAdmin ? '' : 'none';
    if (isAdmin) {
      authRow.innerHTML = '<div class="auth-status">已登入管理模式<button class="auth-link" id="logoutBtn">登出</button></div>';
      document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
      authForm.classList.remove('open');
    } else {
      authRow.innerHTML = '<button class="auth-link" id="authLink">摸摸小被被</button>';
      document.getElementById('authLink').addEventListener('click', () => {
        authForm.classList.toggle('open');
      });
    }
    render();
  }

  onAuthStateChanged(auth, user => {
    isAdmin = !!user;
    updateAuthUI();
  });

  authSubmit.addEventListener('click', async () => {
    authError.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, authEmail.value.trim(), authPassword.value);
      authEmail.value = '';
      authPassword.value = '';
    } catch (err) {
      authError.style.display = 'block';
    }
  });

  authPassword.addEventListener('keydown', e => {
    if (e.key === 'Enter') authSubmit.click();
  });

  function renderRow(c, rank, total, index) {
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const intensity = total > 1 ? 1 - (index / (total - 1)) * 0.85 : 0.6;
    const alpha = (intensity * 0.4).toFixed(2);
    const bg = `linear-gradient(90deg, rgba(201,164,74,${alpha}) 0%, var(--surface) 65%)`;
    const lanes = c.lanes || [];
    const imgBtnContent = c.image ? `<img src="${c.image}" alt="">` : '+';
    const fullData = c.fullData !== false;
    const rowClasses = ['row'];
    if (rank && rank <= 10 && fullData) rowClasses.push('top10');
    if (rank === 1 && fullData) rowClasses.push('rank1');
    if (rank === 2 && fullData) rowClasses.push('rank2');
    if (rank === 3 && fullData) rowClasses.push('rank3');
    const rowClass = rowClasses.join(' ');
    const imgBtnHtml = isAdmin ? `<button class="img-btn" data-id="${c.id}" aria-label="上傳角色圖片">${imgBtnContent}</button>` : (c.image ? `<div class="img-btn" style="cursor:default;">${imgBtnContent}</div>` : '');
    const nameEditable = isAdmin ? `class="name" data-id="${c.id}" data-name="${escapeHtml(c.name)}"` : `class="name" style="cursor:default;"`;
    const valueHtml = fullData
      ? `<div ${isAdmin ? `class="power" data-id="${c.id}" data-power="${c.power}"` : `class="power" style="cursor:default;"`}>${(c.power || 0).toLocaleString()}</div>`
      : `<div ${isAdmin ? `class="power" data-id="${c.id}" data-count="${c.playerCount || 0}"` : `class="power" style="cursor:default;"`}>${(c.playerCount || 0)} 人</div>`;
    const modeToggleHtml = isAdmin
      ? `<button class="lane-pill" data-id="${c.id}" data-mode-toggle="1" style="white-space:nowrap;">${fullData ? '滿10人' : '未滿10人'}</button>`
      : (fullData ? '' : `<span class="lane-pill" style="cursor:default;">未滿10人</span>`);
    const starHtml = '';
    const delHtml = isAdmin ? `<button class="del" data-id="${c.id}" aria-label="刪除">×</button>` : '';
    const lanePills = LANES.filter(l => isAdmin || lanes.includes(l)).map(l =>
      `<div class="lane-pill ${lanes.includes(l) ? 'active' : ''}" ${isAdmin ? `data-id="${c.id}" data-lane="${l}"` : 'style="cursor:default;"'}>${l}</div>`
    ).join('');

    const tierInfo = fullData ? (c._tierInfo || null) : null;
    const tierAttr = tierInfo ? `data-tier="${tierInfo.key}" style="background: ${bg}; --tier-color: ${tierInfo.color}; --tier-glow: ${tierInfo.glow};"` : `style="background: ${bg};"`;
    const tierTagHtml = '';

    return `
      <div class="${rowClass}" ${tierAttr}>
        <div class="row-main">
          <div class="rank ${rankClass}">${rank}</div>
          ${imgBtnHtml}
          <div ${nameEditable}>${escapeHtml(c.name)}</div>
          ${tierTagHtml}
          ${valueHtml}
          ${modeToggleHtml}
          ${starHtml}
          ${delHtml}
        </div>
        <div class="lanes">${lanePills}</div>
      </div>
    `;
  }

  function render() {
    const filtered = currentTab === '全部'
      ? characters
      : characters.filter(c => (c.lanes || []).includes(currentTab));
    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty">${currentTab === '全部' ? '尚無資料，新增第一個角色吧' : '此分路尚無角色'}</div>`;
      return;
    }

    const withPower = filtered.filter(c => c.fullData !== false).sort((a, b) => b.power - a.power);
    const withoutPower = filtered.filter(c => c.fullData === false).sort((a, b) => (b.playerCount || 0) - (a.playerCount || 0));
    const combined = [...withPower, ...withoutPower];
    const total = combined.length;

    const remaining = Math.max(withPower.length - 3, 0);
    const bucketSize = Math.max(Math.ceil(remaining / TIERS.length), 1);
    withPower.forEach((c, idx) => {
      if (idx < 3) {
        c._tierInfo = null;
      } else {
        const pos = idx - 3;
        const tierIdx = Math.min(Math.floor(pos / bucketSize), TIERS.length - 1);
        c._tierInfo = TIERS[tierIdx];
      }
    });

    listEl.innerHTML = combined.map((c, i) => {
      let rank;
      if (i === 0) {
        rank = 1;
      } else {
        const prev = combined[i - 1];
        const sameGroup = (c.fullData !== false) === (prev.fullData !== false);
        const sameValue = c.fullData !== false ? prev.power === c.power : (prev.playerCount || 0) === (c.playerCount || 0);
        rank = sameGroup && sameValue ? prev._rank : i + 1;
      }
      c._rank = rank;
      return renderRow(c, rank, total, i);
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addCharacter() {
    if (!isAdmin) return;
    const newChar = { id: Date.now() + Math.random(), name: '新角色', power: 0, lanes: [], image: null, fullData: true, playerCount: 0, tier: null };
    characters.push(newChar);
    render();
    saveData();
    const nameEl = listEl.querySelector(`.name[data-id="${newChar.id}"]`);
    if (nameEl) startEditName(nameEl);
  }

  function applyViewMode() {
    listEl.classList.toggle('grid', viewMode === 'grid');
    viewToggle.textContent = viewMode === 'grid' ? '☰' : '⊞';
    viewToggle.setAttribute('aria-label', viewMode === 'grid' ? '切換為清單顯示' : '切換為卡片顯示');
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'light' ? '☀' : '☾';
    themeToggle.setAttribute('aria-label', theme === 'light' ? '切換為暗色主題' : '切換為亮色主題');
  }

  themeToggle.addEventListener('click', () => {
    theme = theme === 'light' ? 'dark' : 'light';
    applyTheme();
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (err) {
      console.error('儲存失敗', err);
    }
  });

  viewToggle.addEventListener('click', () => {
    viewMode = viewMode === 'grid' ? 'list' : 'grid';
    applyViewMode();
    try {
      localStorage.setItem(VIEW_KEY, viewMode);
    } catch (err) {
      console.error('儲存失敗', err);
    }
  });

  addBtn.addEventListener('click', addCharacter);

  bulkBtn.addEventListener('click', () => {
    bulkForm.classList.toggle('open');
    if (bulkForm.classList.contains('open')) bulkNames.focus();
  });

  bulkSubmit.addEventListener('click', () => {
    if (!isAdmin) return;
    const lines = bulkNames.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.length === 0) return;
    lines.forEach((name, idx) => {
      characters.push({
        id: Date.now() + Math.random() + idx,
        name,
        power: 0,
        lanes: [],
        image: null,
        fullData: true,
        playerCount: 0,
        tier: null
      });
    });
    bulkNames.value = '';
    bulkForm.classList.remove('open');
    saveData();
    render();
  });

  listEl.addEventListener('click', e => {
    if (!isAdmin) return;
    if (e.target.classList.contains('del')) {
      const id = e.target.dataset.id;
      characters = characters.filter(c => String(c.id) !== id);
      render();
      saveData();
      return;
    }
    if (e.target.dataset.modeToggle) {
      const id = e.target.dataset.id;
      const target = characters.find(c => String(c.id) === id);
      if (target) {
        target.fullData = target.fullData === false ? true : false;
        saveData();
        render();
      }
      return;
    }
    if (e.target.classList.contains('lane-pill')) {
      const id = e.target.dataset.id;
      const lane = e.target.dataset.lane;
      const target = characters.find(c => String(c.id) === id);
      if (target) {
        if (!target.lanes) target.lanes = [];
        const idx = target.lanes.indexOf(lane);
        if (idx === -1) target.lanes.push(lane);
        else target.lanes.splice(idx, 1);
        saveData();
        render();
      }
      return;
    }
    if (e.target.closest('.img-btn')) {
      const btn = e.target.closest('.img-btn');
      pendingImageId = btn.dataset.id;
      imgInput.value = '';
      imgInput.click();
      return;
    }
    if (e.target.classList.contains('power')) {
      if (e.target.dataset.count !== undefined) {
        startEditCount(e.target);
      } else {
        startEditPower(e.target);
      }
      return;
    }
    if (e.target.classList.contains('name')) {
      startEditName(e.target);
    }
  });

  imgInput.addEventListener('change', () => {
    const file = imgInput.files && imgInput.files[0];
    if (!file || !pendingImageId) return;
    const id = pendingImageId;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 480;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = h * (maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = w * (maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        const target = characters.find(c => String(c.id) === id);
        if (target) {
          target.image = dataUrl;
          saveData();
          render();
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  titleEl.addEventListener('click', () => {
    if (!isAdmin) return;
    if (titleEl.querySelector('input')) return;
    const current = title;
    titleEl.innerHTML = `<input type="text" value="${escapeHtml(current)}" maxlength="30">`;
    const input = titleEl.querySelector('input');
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      title = val || current;
      titleEl.textContent = title;
      saveTitle();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') input.blur();
      if (ev.key === 'Escape') { titleEl.textContent = current; }
    });
    input.addEventListener('click', ev => ev.stopPropagation());
  });

  function startEditName(el) {
    const id = el.dataset.id;
    const current = el.dataset.name;
    el.innerHTML = `<input type="text" value="${current}" maxlength="20">`;
    const input = el.querySelector('input');
    input.focus();
    input.select();

    function commit() {
      const val = input.value.trim();
      if (val) {
        const target = characters.find(c => String(c.id) === id);
        if (target) {
          target.name = val;
          saveData();
        }
      }
      render();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') input.blur();
      if (ev.key === 'Escape') { render(); }
    });
    input.addEventListener('click', ev => ev.stopPropagation());
  }

  function startEditPower(el) {
    const id = el.dataset.id;
    const current = el.dataset.power;
    el.innerHTML = `<input type="number" value="${current}">`;
    const input = el.querySelector('input');
    input.focus();
    input.select();

    function commit() {
      const val = Number(input.value);
      if (input.value !== '' && !isNaN(val)) {
        const target = characters.find(c => String(c.id) === id);
        if (target) {
          target.power = val;
          saveData();
        }
      }
      render();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') input.blur();
      if (ev.key === 'Escape') { render(); }
    });
    input.addEventListener('click', ev => ev.stopPropagation());
  }

  function startEditCount(el) {
    const id = el.dataset.id;
    const current = el.dataset.count;
    el.innerHTML = `<input type="number" value="${current}">`;
    const input = el.querySelector('input');
    input.focus();
    input.select();

    function commit() {
      const val = Number(input.value);
      if (input.value !== '' && !isNaN(val)) {
        const target = characters.find(c => String(c.id) === id);
        if (target) {
          target.playerCount = val;
          saveData();
        }
      }
      render();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') input.blur();
      if (ev.key === 'Escape') { render(); }
    });
    input.addEventListener('click', ev => ev.stopPropagation());
  }

  listEl.innerHTML = '<div class="empty">載入中...</div>';
  loadData();
</script>
</body>
</html>
